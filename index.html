<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ASTRION · 网页版 AI</title>
<style>
/* ========== 设计系统 ========== */
:root{
  --bg:#0a0f20;
  --panel:rgba(15,23,42,0.62);
  --panel-hover:rgba(30,41,66,0.72);
  --line:rgba(150,160,210,0.18);
  --text:#f1f5f9;
  --text-dim:#94a3b8;
  --accent:#7c6df2;
  --accent-grad:linear-gradient(135deg,#7c6df2,#38bdf8);
  --accent-glow:rgba(124,109,242,0.45);
  --success:#22c55e;
  --danger:#ef4444;
  --warn:#f59e0b;
  --radius:20px;
  --shadow:0 24px 60px rgba(0,0,0,0.55),0 0 0 1px var(--line);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",PingFang SC,"Microsoft YaHei",sans-serif;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  height:100%;
  width:100%;
  font-family:var(--font);
  color:var(--text);
  background:var(--bg);
  overflow-x:hidden;
  touch-action:manipulation;
}

body{
  min-height:100dvh;
  background:
    radial-gradient(ellipse at 15% 10%,#4f46e522 0,transparent 42%),
    radial-gradient(ellipse at 85% 80%,#0891b222 0,transparent 40%),
    linear-gradient(135deg,#0a0f20,#111827 55%,#0f172a);
  position:relative;
  overflow-y:auto;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  opacity:.5;
  pointer-events:none;
  background:
    radial-gradient(circle at 20% 30%,#7c3aed22 0,transparent 30%),
    radial-gradient(circle at 80% 70%,#06b6d422 0,transparent 30%);
  animation:ambient 20s ease-in-out infinite alternate;
}

@keyframes ambient{
  from{transform:translate(-5%,-5%) scale(1);}
  to{transform:translate(5%,5%) scale(1.15);}
}

/* ========== 布局 ========== */
.app{
  display:grid;
  grid-template-columns:260px 1fr;
  height:100dvh;
  max-width:100%;
  gap:0;
  padding:0;
  max-width:none;
}

.sidebar{
  position:fixed;
  inset-y:0;
  left:0;
  width:260px;
  background:var(--panel);
  border-right:1px solid var(--line);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  display:flex;
  flex-direction:column;
  z-index:40;
  transform:translatex(0);
  transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding:env(safe-area-inset-top) 14px 14px;
}

.sidebar.collapsed{transform:translatex(-105%);}

.main{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
}

@media(max-width:768px){
  .app{grid-template-columns:1fr;}
  .sidebar{transform:translatex(-105%);z-index:50;}
}

/* ========== 背景装饰 ========== */
.bg-glow{
  position:fixed;
  inset:0;
  z-index:-1;
  filter:blur(56px);
  opacity:.7;
  pointer-events:none;
}
.bg-glow::before{content:"";position:absolute;width:520px;height:520px;background:var(--accent-grad);border-radius:50%;top:10%;left:-80px;filter:blur(60px);animation:float 12s ease-in-out infinite alternate;}
.bg-glow::after{content:"";position:absolute;width:480px;height:480px;background:linear-gradient(135deg,#06b6d4,#3b82f6);border-radius:50%;bottom:10%;right:-60px;filter:blur(60px);animation:float 14s ease-in-out infinite alternate-reverse;}

@keyframes float{
  from{transform:translate(-10%,-10%) scale(1);}
  to{transform:translate(8%,8%) scale(1.1);}
}

/* ========== 侧边栏 ========== */
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  margin-bottom:16px;
}

.logo{
  width:40px;height:40px;border-radius:14px;
  background:var(--accent-grad);
  display:grid;place-items:center;font-size:20px;font-weight:800;color:#0b1020;
  box-shadow:0 8px 24px rgba(124,109,242,0.4);
}

.brand-text{display:flex;flex-direction:column;}
.brand-text .name{font-weight:700;font-size:16px;letter-spacing:.5px;}
.brand-text .ver{font-size:10px;color:var(--text-dim);}

.side-label{
  font-size:10px;color:var(--text-dim);letter-spacing:1.6px;text-transform:uppercase;
  padding:8px 14px 2px;display:block;margin-top:14px;
}

.nav-btn{
  display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;
  border:0;background:transparent;color:var(--text);text-align:left;border-radius:12px;
  font-size:14px;cursor:pointer;transition:.2s;
}
.nav-btn:hover{background:rgba(255,255,255,0.06);}
.nav-btn.active{background:rgba(124,109,242,0.12);color:#c7c2ff;border-color:rgba(124,109,242,0.3);}
.nav-btn svg{width:20px;height:20px;flex-shrink:0;color:var(--text-dim);}
.nav-btn.active svg{color:#c7c2ff;}

.side-divider{border-top:1px solid var(--line);margin:12px 0 4px;}

.side-bottom{margin-top:auto;padding-top:8px;}
.version{font-size:11px;color:var(--text-dim);padding:6px 14px;text-align:center;}

.menu-toggle{
  position:fixed;top:12px;left:12px;z-index:60;
  width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,0.06);
  border:1px solid var(--line);color:var(--text);cursor:pointer;display:none;align-items:center;justify-content:center;
}
@media(max-width:768px){
  .menu-toggle{display:flex;}
}

/* ========== 顶部栏 ========== */
.topbar{
  height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;border-bottom:1px solid var(--line);background:rgba(10,15,32,0.4);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);position:sticky;top:0;z-index:30;
}

.top-left{display:flex;align-items:center;gap:12px;}
.top-avatar{width:34px;height:34px;border-radius:10px;background:var(--accent-grad);display:grid;place-items:center;font-size:16px;font-weight:700;color:#050714;box-shadow:0 6px 20px rgba(124,109,242,0.35);}
.top-info .top-name{font-weight:700;font-size:15px;letter-spacing:.3px;}
.top-info .top-sub{font-size:12px;color:var(--text-dim);}

.top-right{display:flex;gap:10px;align-items:center;}
.iconbtn{
  width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.05);
  border:1px solid var(--line);color:var(--text);cursor:pointer;display:grid;place-items:center;font-size:17px;transition:.2s;
}
.iconbtn:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.2);}

/* ========== 欢迎页 ========== */
#chat{
  flex:1;overflow-y:auto;padding:28px clamp(18px,6vw,34px) 34px;
  display:flex;flex-direction:column;gap:20px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
  position:relative;
}

.welcome{
  margin:auto;text-align:center;max-width:620px;display:flex;flex-direction:column;align-items:center;
}

.orb{
  width:80px;height:80px;border-radius:28px;
  background:var(--accent-grad);
  display:grid;place-items:center;font-size:38px;color:#080c18;
  box-shadow:0 18px 50px rgba(124,109,242,0.45);
  animation:orbFloat 5s ease-in-out infinite;
}

.welcome h2{font-size:clamp(26px,5vw,40px);margin:22px 0 6px;font-weight:800;letter-spacing:-.3px;}
.welcome p{color:var(--text-dim);margin:0 0 28px;font-size:15px;line-height:1.6;}

.suggestions{
  display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:0 8px;
}
.sugg-btn{
  padding:10px 16px;border-radius:30px;border:1px solid var(--line);background:rgba(255,255,255,0.04);
  color:var(--text);font-size:13.5px;cursor:pointer;transition:.2s;white-space:nowrap;
}
.sugg-btn:hover{background:rgba(255,255,255,0.09);border-color:rgba(124,109,242,0.4);color:#fff;}

@keyframes orbFloat{
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-10px) scale(1.05);}
}

/* ========== 消息 ========== */
.msg{
  max-width:min(720px,92%);white-space:pre-wrap;overflow-wrap:anywhere;padding:14px 18px;
  border-radius:18px;line-height:1.7;font-size:15px;position:relative;
  animation:msgIn .42s cubic-bezier(.18,.85,.25,1) both;
  border:1px solid var(--line);
}

@keyframes msgIn{
  from{opacity:0;transform:translateY(14px) scale(.985);}
  to{opacity:1;transform:none;}
}

.msg .role-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;color:var(--text-dim);font-weight:700;letter-spacing:.6px;text-transform:uppercase;}
.msg .avatar-sm{width:22px;height:22px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;flex-shrink:0;}
.msg.user .avatar-sm{background:var(--accent-grad);color:#080c18;}
.msg.ai .avatar-sm{background:rgba(255,255,255,0.06);border-color:var(--line);color:var(--text-dim);}

.msg.user{
  align-self:flex-end;background:var(--accent-grad);color:#040a16;
  border-bottom-right-radius:4px;border-color:transparent;box-shadow:0 10px 30px rgba(124,109,242,0.35);
}
.msg.ai{
  align-self:flex-start;background:var(--panel);border-bottom-left-radius:4px;
}

.msg img{max-width:100%;max-height:240px;border-radius:14px;margin-top:8px;display:block;}
.msg pre{background:rgba(0,0,0,0.25);padding:12px;border-radius:10px;font-size:13px;overflow-x:auto;margin-top:8px;white-space:pre-wrap;color:#e2e8f0;}
.msg code{background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:4px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
.msg.error{border-color:rgba(239,68,68,0.3);color:#fecaca;}

.msg-tools{display:flex;gap:8px;margin-top:10px;}
.msg-tools button{
  font-size:11.5px;color:var(--text-dim);background:transparent;border:0;cursor:pointer;padding:6px 9px;border-radius:8px;transition:.2s;
}
.msg-tools button:hover{background:rgba(255,255,255,0.06);color:var(--text);}

/* ========== 输入区 ========== */
.composer-wrap{
  padding:12px clamp(12px,4vw,40px) 20px;border-top:1px solid var(--line);
  background:linear-gradient(180deg,transparent,#0a0f2099);position:sticky;bottom:0;z-index:30;
}

.composer{max-width:900px;margin:0 auto;background:rgba(15,23,42,0.55);border:1px solid var(--line);border-radius:16px;
  padding:10px;display:flex;align-items:flex-end;gap:10px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px;}

.input-row{display:flex;align-items:flex-end;gap:8px;width:100%;}
#prompt{
  flex:1;min-height:44px;max-height:160px;resize:none;border:0;outline:0;background:transparent;
  color:var(--text);font:inherit;padding:10px 8px;font-size:15px;line-height:1.5;
}
#prompt::placeholder{color:var(--text-dim);}

.btn-send{
  width:44px;height:44px;border-radius:13px;background:var(--accent-grad);color:#070c1a;
  font-size:20px;font-weight:800;display:grid;place-items:center;border:0;cursor:pointer;
  box-shadow:0 8px 22px rgba(124,109,242,0.45);transition:.2s;flex-shrink:0;
}
.btn-send:active{transform:scale(.94);}
.btn-send:disabled{opacity:.55;cursor:not-allowed;transform:none;}

.composer-foot{
  display:flex;align-items:center;justify-content:space-between;padding:5px 6px 0;color:var(--text-dim);font-size:11.5px;
}
.toolrow{display:flex;gap:6px;}
.toolrow button{
  width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,0.04);border:1px solid var(--line);
  color:var(--text-dim);cursor:pointer;display:grid;place-items:center;font-size:15px;transition:.2s;
}
.toolrow button:hover{background:rgba(255,255,255,0.09);color:var(--text);}

/* ========== 模态框 ========== */
.modal-back{
  position:fixed;inset:0;background:rgba(3,6,14,0.75);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:100;opacity:0;transition:opacity .25s;
  padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.modal-back.show{display:flex;opacity:1;}

.modal{
  width:min(700px,92%);max-height:90dvh;background:var(--panel);border:1px solid var(--line);
  border-radius:24px;padding:24px;margin:auto 0;overflow-y:auto;box-shadow:var(--shadow);
  animation:modalUp .35s cubic-bezier(.2,.8,.2,1) both;transform-origin:center;
}
@keyframes modalUp{
  from{opacity:0;transform:translateY(20px) scale(.97);}
  to{opacity:1;transform:none;}
}

.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--line);}
.modal h3{font-size:19px;font-weight:800;margin:0;letter-spacing:-.2px;}
.close-btn{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid var(--line);
  color:var(--text);cursor:pointer;display:grid;place-items:center;font-size:17px;transition:.2s;}
.close-btn:hover{background:rgba(255,255,255,0.12);}

.field{margin-bottom:16px;}
.field label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:8px;font-weight:600;}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,0.03);
  color:var(--text);outline:none;font:inherit;font-size:14px;transition:.2s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(124,109,242,0.5);box-shadow:0 0 0 4px rgba(124,109,242,0.1);}

.checkbox-row{display:flex;align-items:center;gap:10px;margin-top:14px;}
.checkbox-row input{width:18px;height:18px;accent-color:var(--accent);}

.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line);}
.btn-ghost{
  padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:14px;transition:.2s;
}
.btn-ghost:hover{background:rgba(255,255,255,0.06);}
.btn-primary{
  padding:10px 20px;border-radius:10px;border:0;background:var(--accent-grad);color:#060812;font-weight:700;cursor:pointer;font-size:14px;transition:.2s;
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px);}
.btn-danger{border-color:rgba(239,68,68,0.3);color:#fca5a5;}
.btn-danger:hover{background:rgba(239,68,68,0.1);}

/* ========== 通知 ========== */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,100px);z-index:110;
  background:rgba(15,23,42,0.92);border:1px solid var(--line);color:#fff;padding:12px 18px;border-radius:14px;
  backdrop-filter:blur(12px);box-shadow:var(--shadow);opacity:0;transition:.3s;pointer-events:none;
  min-width:200px;text-align:center;font-size:14px;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ========== 滚动条 ========== */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.22);}

/* ========== 工具类 ========== */
.hidden{display:none!important;}
.flex{display:flex;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.gap-8{gap:8px;}
.text-center{text-align:center;}
.muted{color:var(--text-dim);}
.font-bold{font-weight:700;}
.rounded{border-radius:var(--radius);}

@media(max-width:768px){
  .app{padding-top:0;}
  .main{padding-top:0;}
  .topbar{height:54px;padding:0 12px;}
  #chat{padding:20px 12px 80px;gap:16px;}
  .msg{max-width:90%;padding:12px 16px;font-size:14.5px;}
  .composer-wrap{padding:10px 12px 16px;}
  .composer{padding:8px;border-radius:14px;}
  #prompt{font-size:14px;}
  .btn-send{width:40px;height:40px;}
  .modal{padding:20px;width:90%;}
}

/* 已读/发送状态 */
.status-tag{font-size:10px;color:var(--text-dim);margin-top:4px;display:flex;align-items:center;gap:4px;}
.status-ok{color:#34d399;}
.status-err{color:#f87171;}
</style>
</head>
<body>

<!-- 背景装饰 -->
<div class="bg-glow"></div>

<!-- 菜单按钮（手机端） -->
<button class="menu-toggle" id="menuToggle" aria-label="打开菜单">☰</button>

<!-- 侧边栏 -->
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo">A</div>
    <div class="brand-text">
      <div class="name">ASTRION</div>
      <div class="ver">v1.1.5 Pro</div>
    </div>
  </div>

  <div class="side-label">对话</div>
  <button class="nav-btn active" id="navChat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>新对话</span></button>
  <button class="nav-btn" id="navHistory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 1 0 7 5v2.112"/></svg><span>历史记录</span></button>
  <button class="nav-btn" id="navCustomAI"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/></svg><span>我的 AI</span></button>

  <div class="side-label">设置</div>
  <button class="nav-btn" id="navSettings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1-1.51L3 16a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/></svg><span>设置</span></button>
  <button class="nav-btn" id="navAdmin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V9m9 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM3 3h18v18H3Z"/></svg><span>管理后台</span></button>

  <div class="side-bottom">
    <div class="version">ASTRION AI</div>
  </div>
</aside>

<!-- 主体 -->
<div class="main">
  <header class="topbar">
    <div class="top-left">
      <div class="top-avatar">U</div>
      <div class="top-info">
        <div class="top-name" id="topName">游客</div>
        <div class="top-sub">未登录</div>
      </div>
    </div>
    <div class="top-right">
      <button class="iconbtn" id="btnSetting" title="设置">⚙</button>
      <button class="iconbtn" id="btnUser" title="账户">👤</button>
    </div>
  </header>

  <div id="chat">
    <div class="welcome" id="welcomeScreen">
      <div class="orb">🤖</div>
      <h2>你好，我是 ASTRION</h2>
      <p>一个免费、好用的网页版 AI 助手。<br>开始你的第一次对话吧。</p>
      <div class="suggestions">
        <button class="sugg-btn" onclick="sendSuggestion('帮我写一个自我介绍')">自我介绍</button>
        <button class="sugg-btn" onclick="sendSuggestion('写一段 Python 代码')">写代码</button>
        <button class="sugg-btn" onclick="sendSuggestion('讲个冷笑话')">讲笑话</button>
        <button class="sugg-btn" onclick="sendSuggestion('画一只可爱的猫')">AI 绘画</button>
      </div>
    </div>

    <div id="msgContainer"></div>
    <div id="typingIndicator" style="display:none;align-self:flex-start;max-width:200px;">
      <div class="msg ai">
        <div class="role-row"><div class="avatar-sm">A</div><span>ASTRION</span></div>
        <span class="typing-text">正在思考<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>
      </div>
    </div>
  </div>

  <div class="composer-wrap">
    <div class="composer">
      <div class="input-row">
        <textarea id="prompt" placeholder="输入你的问题…支持回车发送，Shift+回车换行" rows="1"></textarea>
        <button class="btn-send" id="btnSend">→</button>
      </div>
      <div class="composer-foot">
        <div class="toolrow">
          <button class="iconbtn" id="btnImage" title="上传图片">📷</button>
          <button class="iconbtn" id="btnSearch" title="联网搜索">🔍</button>
        </div>
        <div class="muted" id="statusText">就绪</div>
      </div>
    </div>
  </div>
</div>

<!-- 模态框 -->
<div class="modal-back" id="modalBack"></div>

<div class="modal" id="modalAuth">
  <div class="modal-head">
    <h3>账户登录</h3>
    <button class="close-btn" onclick="closeModal('modalAuth')">✕</button>
  </div>
  <div class="field">
    <label>账号 ID</label>
    <input id="authId" placeholder="念绪968" maxlength="32">
  </div>
  <div class="field">
    <label>密码</label>
    <input id="authPwd" type="password" placeholder="输入密码" minlength="6">
  </div>
  <div class="checkbox-row">
    <input type="checkbox" id="authRemember" checked>
    <label>记住登录状态</label>
  </div>
  <div class="modal-actions">
    <button class="btn-ghost" onclick="switchAuthTab()">还没有账号？去注册</button>
    <button class="btn-primary" onclick="doLogin()">登录</button>
  </div>
  <div style="margin-top:12px;text-align:center;color:var(--text-dim);font-size:12px;">
    默认管理员：念绪968 / nianxu968（建议修改）
  </div>
</div>

<div class="modal" id="modalRegister" style="display:none;">
  <div class="modal-head">
    <h3>创建账号</h3>
    <button class="close-btn" onclick="switchAuthTab()">返回登录</button>
  </div>
  <div class="field">
    <label>账号 ID</label>
    <input id="regId" placeholder="2-32 位字母、数字、中文、下划线或短横线">
  </div>
  <div class="field">
    <label>显示名称</label>
    <input id="regDisplay" placeholder="显示在界面上的名字">
  </div>
  <div class="field">
    <label>密码</label>
    <input id="regPwd" type="password" placeholder="至少 6 位">
  </div>
  <div class="modal-actions">
    <button class="btn-ghost" onclick="switchAuthTab()">已有账号，去登录</button>
    <button class="btn-primary" onclick="doRegister()">注册</button>
  </div>
</div>

<div class="modal" id="modalSettings">
  <div class="modal-head">
    <h3>设置</h3>
    <button class="close-btn" onclick="closeModal('modalSettings')">✕</button>
  </div>
  <div class="field">
    <label>主题色</label>
    <select id="settingTheme">
      <option value="#7c6df2">紫蓝渐变</option>
      <option value="#06b6d4">青春青</option>
      <option value="#ec4899">玫瑰粉</option>
      <option value="#10b981">翡翠绿</option>
    </select>
  </div>
  <div class="field">
    <label>字体大小</label>
    <select id="settingFont">
      <option value="14px">小</option>
      <option value="15px" selected>中</option>
      <option value="16px">大</option>
    </select>
  </div>
  <div class="checkbox-row">
    <input type="checkbox" id="settingSound" checked>
    <label>发送提示音</label>
  </div>
  <div class="modal-actions">
    <button class="btn-ghost" onclick="closeModal('modalSettings')">取消</button>
    <button class="btn-primary" onclick="saveSettings()">保存</button>
  </div>
</div>

<div class="modal" id="modalAdmin">
  <div class="modal-head">
    <h3>管理后台</h3>
    <button class="close-btn" onclick="closeModal('modalAdmin')">✕</button>
  </div>
  <div style="padding:12px;background:rgba(255,255,255,0.03);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;">
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">AI 接口配置</div>
    <div id="adminApis" style="font-size:12px;color:var(--text-dim);">加载中…</div>
  </div>
  <div class="modal-actions">
    <button class="btn-ghost" onclick="closeModal('modalAdmin')">关闭</button>
  </div>
</div>

<div class="modal" id="modalImage">
  <div class="modal-head">
    <h3>AI 绘画</h3>
    <button class="close-btn" onclick="closeModal('modalImage')">✕</button>
  </div>
  <div class="field">
    <label>描述画面内容</label>
    <input id="imgPrompt" placeholder="一只穿宇航服的猫在月球上，梦幻风格">
  </div>
  <div class="field">
    <label>比例</label>
    <select id="imgAspect">
      <option value="square">正方形 1:1</option>
      <option value="landscape">横图 16:9</option>
      <option value="portrait">竖图 9:16</option>
    </select>
  </div>
  <div class="modal-actions">
    <button class="btn-ghost" onclick="closeModal('modalImage')">取消</button>
    <button class="btn-primary" onclick="doImage()">生成</button>
  </div>
</div>

<div id="toast" class="toast">操作成功</div>

<script>
/* ========== 状态 ========== */
let sessionToken=null, currentUserId=null, currentUserRole='guest', isLoggedIn=false;
let isSearchMode=false, isImageMode=false;
let typingTimer=null;

/* ========== 工具 ========== */
function $(id){return document.getElementById(id);}
function toast(msg,type='info'){
  const t=$('toast');t.textContent=msg;
  if(type==='error'){t.style.borderColor='rgba(239,68,68,0.3)';t.style.color='#fca5a5';}
  else if(type==='success'){t.style.borderColor='rgba(34,197,94,0.3)';t.style.color='#86efac';}
  else{t.style.borderColor='var(--line)';t.style.color='#fff';}
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);
}
function scrollToBottom(){setTimeout(()=>{window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});},100);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));}

/* ========== 侧边栏 ========== */
$('menuToggle').onclick=()=>{$('sidebar').classList.toggle('collapsed');};
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    if(window.innerWidth<=768)$('sidebar').classList.add('collapsed');
  };
});

/* ========== 登录/会话 ========== */
async function checkSession(){
  try{
    const r=await fetch('/api/session',{credentials:'same-origin'});
    const d=await r.json();
    if(d.authenticated){
      isLoggedIn=true;currentUserId=d.userId;currentUserRole=d.role;
      $('topName').textContent=d.role==='admin'?'管理员':(d.displayName||d.userId);
      $('topSub')&&($('topSub').textContent=d.role);
      $('authRemember')&&($('authRemember').checked=true);
      $('welcomeScreen')&&($('welcomeScreen').style.display='none');
      $('msgContainer')&&($('msgContainer').innerHTML='');
      loadHistory();
    }else{
      openModal('modalAuth');
    }
  }catch(e){openModal('modalAuth');}
}
checkSession();

function openModal(id){$(id).classList.add('show');}
function closeModal(id){$(id).classList.remove('show');}

function switchAuthTab(){
  const a=$('modalAuth'),r=$('modalRegister');
  if(a.style.display!=='none'){a.style.display='none';r.style.display='block';}
  else{r.style.display='none';a.style.display='block';}
}

async function doLogin(){
  const id=$('authId').value.trim(),pwd=$('authPwd').value;
  if(!id||!pwd){toast('请输入账号和密码','error');return;}
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,password:pwd})});
    const d=await r.json();
    if(r.ok){isLoggedIn=true;currentUserId=d.userId;currentUserRole=d.role;closeModal('modalAuth');$('welcomeScreen').style.display='none';$('msgContainer').innerHTML='';toast('登录成功','success');loadHistory();scrollToBottom();}
    else toast(d.error||'登录失败','error');
  }catch(e){toast('网络错误','error');}
}

async function doRegister(){
  const id=$('regId').value.trim(),pwd=$('regPwd').value,disp=$('regDisplay').value.trim()||id;
  if(!id||!pwd){toast('请填写完整','error');return;}
  try{
    const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,password:pwd,displayName:disp})});
    const d=await r.json();
    if(r.ok){toast('注册成功，请登录','success');switchAuthTab();$('authId').value=id;}
    else toast(d.error||'注册失败','error');
  }catch(e){toast('网络错误','error');}
}

/* ========== 聊天 ========== */
function addMsg(role,text,html=false){
  const div=document.createElement('div');
  div.className='msg '+role;
  const name=role==='user'?'你':'ASTRION';
  const avatar=role==='user'?'U':'A';
  const safe=html?text:escapeHtml(text).replace(/\n/g,'<br>');
  div.innerHTML=`
    <div class="role-row"><div class="avatar-sm">${avatar}</div><span>${name}</span></div>
    <div>${safe}</div>
    <div class="status-tag"><span class="status-ok">●</span><span>已发送</span></div>
  `;
  $('msgContainer').appendChild(div);
  scrollToBottom();
  return div;
}

function addError(text){
  const div=document.createElement('div');
  div.className='msg ai error';
  div.innerHTML=`<div class="role-row"><div class="avatar-sm">A</div><span>ASTRION</span></div><div>${escapeHtml(text)}</div><div class="status-tag"><span class="status-err">●</span><span>出错了</span></div>`;
  $('msgContainer').appendChild(div);
  scrollToBottom();
  return div;
}

function setTyping(show){
  const ti=$('typingIndicator');
  if(show){ti.style.display='flex';scrollToBottom();}
  else{ti.style.display='none';}
}

async function sendMessage(){
  const input=$('prompt');
  const text=input.value.trim();
  if(!text||!isLoggedIn)return;
  input.value='';input.style.height='auto';
  addMsg('user',text);
  setTyping(true);$('statusText').textContent='正在回复…';

  try{
    const r=await fetch('/api/ai/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content:text}],autoFallback:true})
    });
    const d=await r.json();
    setTyping(false);
    if(r.ok&&d.answer){
      addMsg('ai',d.answer);
      $('statusText').textContent='就绪';
    }else{
      addError(d.error||'未知错误');
      $('statusText').textContent='错误';
    }
  }catch(e){
    setTyping(false);addError('网络请求失败');$('statusText').textContent='错误';
  }
}

$('btnSend').onclick=sendMessage;
$('prompt').addEventListener('input',function(){this.style.height='auto';this.style.height=this.scrollHeight+'px';});
$('prompt').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage;}
});

function sendSuggestion(text){
  $('prompt').value=text;
  $('prompt').dispatchEvent(new Event('input'));
  sendMessage();
}

/* ========== 历史记录 ========== */
async function loadHistory(){
  // 这里可接 /api/history，当前版本为演示
  $('msgContainer').innerHTML='';
  const div=document.createElement('div');
  div.className='msg ai';
  div.innerHTML=`<div class="role-row"><div class="avatar-sm">A</div><span>ASTRION</span></div><div>欢迎回来！我准备好为你服务了。</div>`;
  $('msgContainer').appendChild(div);
  scrollToBottom();
}

/* ========== 联网搜索 ========== */
$('btnSearch').onclick=()=>{
  isSearchMode=!isSearchMode;
  $('btnSearch').style.background=isSearchMode?'rgba(124,109,242,0.2)':'transparent';
  $('btnSearch').style.color=isSearchMode?'#c7c2ff':var(--text-dim);
  toast(isSearchMode?'联网搜索已开启':'联网搜索已关闭');
};

/* ========== 图片 ========== */
$('btnImage').onclick=()=>{openModal('modalImage');};
async function doImage(){
  const prompt=$('imgPrompt').value.trim();
  if(!prompt){toast('请输入描述','error');return;}
  closeModal('modalImage');
  addMsg('user','[绘画] '+prompt);
  setTyping(true);
  try{
    const r=await fetch('/api/ai/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,aspect:'square'})});
    const d=await r.json();setTyping(false);
    if(r.ok){
      const img=document.createElement('img');
      if(d.url)img.src=d.url;
      else{
        // 尝试将返回作为 base64 或 blob 处理
        img.src=URL.createObjectURL(new Blob([d.bytes||new ArrayBuffer(0)],{type:'image/png'}));
      }
      const wrap=document.createElement('div');wrap.className='msg ai';
      wrap.innerHTML=`<div class="role-row"><div class="avatar-sm">A</div><span>ASTRION</span></div>`;
      wrap.appendChild(img);
      $('msgContainer').appendChild(wrap);scrollToBottom();
    }else addError(d.error||'绘画失败');
  }catch(e){setTyping(false);addError('绘画请求失败');}
}

/* ========== 设置/管理 ========== */
$('btnSetting').onclick=()=>{closeModal('modalAdmin');openModal('modalSettings');};
$('btnUser').onclick=()=>{openModal('modalAuth');};

async function loadAdminApis(){
  try{
    const r=await fetch('/api/admin/apis',{credentials:'same-origin'});
    const d=await r.json();
    $('adminApis').innerHTML=(d.apis||[]).map(a=>`<div style="margin:4px 0;font-size:12px;">• ${escapeHtml(a.name)} ${a.keySet?`<span style="color:#22c55e">●已配置</span>`:`<span style="color:#94a3b8">○未配置</span>`}`).join('');
  }catch(e){$('adminApis').textContent='无法加载';}
}

$('navAdmin').onclick=()=>{
  if(currentUserRole!=='admin'){toast('需要管理员权限','error');return;}
  closeModal('modalSettings');openModal('modalAdmin');loadAdminApis();
};

function saveSettings(){closeModal('modalSettings');toast('设置已保存','success');}

/* ========== 初始化完成 ========== */
document.addEventListener('DOMContentLoaded',()=>{
  if(!isLoggedIn)openModal('modalAuth');
  else loadHistory();
});
</script>
</body>
</html>
